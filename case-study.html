  -->
  <script>

      var SLUGS = {
        kindoku: "case-study-kindoku.html",

        "the-cosmetics-company-store": "case-study-the-cosmetics-company-store.html"
      };
      var wanted = new URLSearchParams(window.location.search).get("project");
      var target = SLUGS[wanted] || "case-study-kindoku.html";
      window.location.replace(target);
    })();
  </script>
